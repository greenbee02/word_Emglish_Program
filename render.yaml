services:
  - type: web
    name: word-garden-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: word-garden-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WORKSPACE_ID
        value: default
      - key: NODE_VERSION
        value: 22

databases:
  - name: word-garden-db
    databaseName: word_garden
    user: word_garden
